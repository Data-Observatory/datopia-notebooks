name: Validar index.json y snippets

on:
  pull_request:
  push:
    branches: [main]

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar que index.json está al día
        run: python scripts/build_index.py --check
      - name: Verificar que snippets.es.json y snippets.en.json están al día
        run: python scripts/build_snippets.py --check
      - name: Verificar que los enlaces antiguos apuntan a notebooks que existen
        run: python scripts/check_moved.py
